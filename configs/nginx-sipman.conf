# SIP Manager Web UI - nginx reverse proxy
# Replaces dSIPRouter's nginx config on port 5000
# Place this in /etc/nginx/sites-available/sipman.conf

# Unix socket for Flask app (via gunicorn)
upstream sipman_backend {
    server unix:/run/sipman/sipman.sock;
}

server {
    listen 5000 ssl http2 so_keepalive=on;
    listen [::]:5000 ssl http2 so_keepalive=on;
    server_name sip.mrnet.work;

    # Let's Encrypt TLS certificates
    ssl_certificate     /etc/letsencrypt/live/sip.mrnet.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sip.mrnet.work/privkey.pem;

    # TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/sipman_access.log;
    error_log  /var/log/nginx/sipman_error.log;

    # Rate limiting for login
    location /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://sipman_backend;
        proxy_set_header Host $host;
    }

    # Reverse proxy to Flask/Gunicorn
    location / {
        proxy_pass http://sipman_backend;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Static files
    location /static/ {
        alias /opt/sipman/static/;
        expires 1d;
    }

    # Health check - proxy to Flask for dynamic health check
    location /health {
        access_log off;
        proxy_pass http://sipman_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
