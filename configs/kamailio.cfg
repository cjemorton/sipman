modparam("dialog", "timeout_avp", "$dlg_ctx(timeout)")


#======================================================================
# XHTTP event route (required by jsonrpcs)
#======================================================================

event_route[xhttp:request] {
    jsonrpc_exec("");
}


#======================================================================
# Request Routing Logic
#======================================================================

request_route {

    # Initial checks
    set_reply_no_connect();

    if (!mf_process_maxfwd_header("10")) {
        send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check()) {
        send_reply("400", "Bad Request");
        exit;
    }

    if (t_precheck_trans()) {
        t_check_trans();
        exit;
    }
    if (!t_check_trans()) {
        t_newtran();
    }

    # Rate limiting via pike
    if (!pike_check_req()) {
        xlog("L_WARN", "[$ci] Rate limit exceeded for $si\n");
        send_reply("503", "Service Unavailable");
        exit;
    }

    # NAT detection
    if (nat_uac_test("3")) {
        force_rport();
    }
    if (nat_uac_test("19")) {
        set_contact_alias();
    }
    if (is_method("REGISTER") && !isflagset(1)) {
        if (nat_uac_test("22")) {
            setflag(1);
        }
    }

    # Handle CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        if (!rtpengine_delete()) {
            xlog("L_WARN", "[$ci] rtpengine_delete() failed on CANCEL\n");
        }
        exit;
    }

    # Handle requests within SIP dialogs
    if (has_totag()) {
        t_relay();
        exit;
    }

    # Handle REGISTER
    if (is_method("REGISTER")) {
        if (!auth_check("$fd", "subscriber", "3")) {
            auth_challenge("$fd", "0");
            exit;
        }
        if (!save("location")) {
            exit;
        }
        exit;
    }

    # Handle INVITE
    if (is_method("INVITE")) {
        if (uri == myself) {
            # Local user to local user call
            if (!lookup("location")) {
                send_reply("404", "User Not Found");
                exit;
            }
            if (has_body("application/sdp")) {
                rtpengine_offer();
            }
            t_on_reply("RTP_REPLY");
            t_relay();
            exit;
        } else {
            # External call - use dispatcher
            if (!ds_select_dst("1", "4")) {
                xlog("L_WARN", "[$ci] No destination found in dispatcher set 1\n");
                send_reply("404", "No Route");
                exit;
            }
            $du = $ds;
            xlog("L_INFO", "[$ci] Routing to: $du\n");
            if (has_body("application/sdp")) {
                rtpengine_offer("replace-origin");
            }
            t_on_reply("RTP_REPLY");
            t_relay();
            exit;
        }
    }

    # Default relay
    t_relay();
}


#======================================================================
# Reply Routes
#======================================================================

onreply_route[RTP_REPLY] {
    if (is_method("INVITE") && has_body("application/sdp")) {
        rtpengine_offer();
    }
    return;
}


#======================================================================
# Failure Routes
#======================================================================

failure_route[FAIL] {
    if (is_method("INVITE")) {
        if (t_check_status("503") || t_check_status("404")) {
            if (ds_next_domain()) {
                $du = $ds;
                t_on_reply("RTP_REPLY");
                t_relay();
                exit;
            }
        }
    }
    return;
}


#======================================================================
# Event Routes
#======================================================================

event_route[kamailio:startup] {
    xlog("L_WARN", "Kamailio started - pure config without dSIPRouter\n");
}

event_route[kamailio:shutdown] {
    xlog("L_WARN", "Kamailio shutting down\n");
}
