#!KAMAILIO
#######
##
##   Pure Kamailio Configuration for sip.mrnet.work
##   Without dSIPRouter - clean, minimal, well-documented
##
#######


#======================================================================
# Feature Defines
#======================================================================

#!define WITH_MYSQL
#!define WITH_TLS
#!define WITH_RTPENGINE
#!define WITH_DISPATCHER
#!define WITH_PIKE
# ##!define WITH_DEBUG


#======================================================================
# String Defines
#======================================================================

# Database connection
#!define DBURL "mysql://kamailio:cNN6bVkmbKaSlGiuxNt2EEP0GYCv6DfqfvOp5sNXjrvYI7ub4WDEm1qL9gBUITcA@localhost:3306/kamailio"

# RTPEngine ng control socket
#!define RTPENGINE_URI "udp:localhost:7722"

# Network configuration
#!define EXTERNAL_IP_ADDR "40.233.87.224"
#!define INTERNAL_IP_ADDR "10.60.0.222"
#!define DOMAIN "sip.mrnet.work"
#!define SIP_PORT 5060
#!define SIPS_PORT 5061


#======================================================================
# Global Parameters
#======================================================================

debug = 2
log_stderror = no
log_facility = LOG_LOCAL0
log_prefix = "[$cfg(name):$cfg(line):$ci:$rm:$rs] "

fork = yes
children = 8
tcp_children = 4
tcp_connection_lifetime = 3605
http_reply_parse = yes
server_signature = no
auto_aliases = no
enable_sctp = 0

enable_tls = yes
tcp_accept_no_cl = true
tcp_rd_buf_size = 16384
mhomed = 1

alias = "sip.mrnet.work"
alias = "micro-87-224"

# Listen on loopback and all interfaces
# 40.233.87.224 is the public IP (not a local interface, so we use 0.0.0.0)
# We advertise the external IP for SIP message Contact headers
listen = udp:0.0.0.0:SIP_PORT advertise EXTERNAL_IP_ADDR:SIP_PORT
listen = tcp:0.0.0.0:SIP_PORT advertise EXTERNAL_IP_ADDR:SIP_PORT
listen = tls:INTERNAL_IP_ADDR:SIPS_PORT advertise EXTERNAL_IP_ADDR:SIPS_PORT


#======================================================================
# Module Loading
#======================================================================

mpath = "/usr/lib64/kamailio/modules/"

loadmodule "db_mysql.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
