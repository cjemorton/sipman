; ============================================================
; SipMan Backend — Supervisord Configuration
; Manages MariaDB, Kamailio, RTPEngine, and Flask API (gunicorn)
;
; Optimized for resource-constrained hosts (764MB RAM):
;   - MariaDB: explicit bind-address, innodb_buffer_pool_size=32M
;   - Kamailio: reduced memory -m 64 -M 16, waits for MariaDB
;   - RTPEngine: userspace mode (table=-1), no nftables needed
;   - Gunicorn: 2 workers + --preload, reduced memory
; ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---- MariaDB ----
; Explicit --skip-networking=false ensures TCP listening (Alpine's
; mariadbd-safe defaults can disable networking).  bind-address=127.0.0.1
; restricts to loopback for security.
[program:mariadb]
command=/usr/bin/mariadbd-safe --user=mysql --datadir=/var/lib/mysql --skip-networking=false --bind-address=127.0.0.1
user=mysql
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb_err.log

; ---- RTPEngine ----
; --table=-1 uses userspace forwarding instead of nftables kernel rules.
; This eliminates the nftables dependency and CAP_NET_ADMIN requirement,
; avoiding "Failed to create nftables chains" errors on RHEL 9 kernels.
[program:rtpengine]
command=/usr/bin/rtpengine --interface=%(ENV_RTPENGINE_INTERFACE)s --listen-ng=%(ENV_RTPENGINE_HOST)s:%(ENV_RTPENGINE_PORT)s --table=-1 --pidfile=/var/run/rtpengine.pid --foreground
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/rtpengine.log
stderr_logfile=/var/log/supervisor/rtpengine_err.log

; ---- Kamailio ----
; Reduced memory: -m 64 (pkg mem) -M 16 (private mem), down from -m 256 -M 32.
; priority=20 ensures kamailio starts AFTER mariadb (priority 10).
; startsecs=8 gives MariaDB time to accept TCP connections.
[program:kamailio]
command=/kamailio-start.sh
user=kamailio
group=kamailio
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/var/log/supervisor/kamailio.log
stderr_logfile=/var/log/supervisor/kamailio_err.log

; ---- Flask API (gunicorn) ----
; 2 workers (down from 4) + --preload shares memory between workers.
[program:api]
command=/opt/venv/bin/gunicorn --bind 0.0.0.0:5000 --workers 2 --preload --timeout 30 wsgi:app
directory=/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api_err.log
environment=PYTHONUNBUFFERED="1"
