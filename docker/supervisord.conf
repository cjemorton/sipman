; ============================================================
; SipMan Backend — Supervisord Configuration
; Manages MariaDB, Kamailio, RTPEngine, and Flask API (gunicorn)
; ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---- MariaDB ----
[program:mariadb]
command=/usr/bin/mysqld_safe --user=mysql --datadir=/var/lib/mysql
user=mysql
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb_err.log

; ---- RTPEngine ----
[program:rtpengine]
command=/usr/bin/rtpengine --interface=%(ENV_RTPENGINE_INTERFACE)s --listen-ng=%(ENV_RTPENGINE_HOST)s:%(ENV_RTPENGINE_PORT)s --pidfile=/var/run/rtpengine.pid --foreground
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/rtpengine.log
stderr_logfile=/var/log/supervisor/rtpengine_err.log

; ---- Kamailio ----
[program:kamailio]
command=/usr/sbin/kamailio -f /etc/kamailio/kamailio.cfg -DD -m 256 -M 32
user=kamailio
group=kamailio
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/kamailio.log
stderr_logfile=/var/log/supervisor/kamailio_err.log

; ---- Flask API (gunicorn) ----
[program:api]
command=/usr/local/bin/gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 30 wsgi:app
directory=/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api_err.log
environment=PYTHONUNBUFFERED="1"
