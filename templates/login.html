<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP Manager - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a2e; min-height: 100vh; }
        .login-card { 
            background: #16213e; 
            border: 1px solid #0f3460; 
            border-radius: 12px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .login-title { color: #e94560; }
        .form-control { 
            background: rgba(255,255,255,0.1); 
            border: 1px solid #0f3460; 
            color: #fff; 
        }
        .form-control:focus { background: rgba(255,255,255,0.15); border-color: #e94560; color: #fff; }
        .form-label { color: #a0a0b0; }
        .btn-primary { background: #e94560; border: none; }
        .btn-primary:hover { background: #c8184b; }
    </style>
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="col-md-4">
            <div class="card login-card">
                <div class="card-body p-5">
                    <h2 class="text-center login-title mb-4">SIP Manager</h2>
                    <p class="text-center text-muted mb-4">Pure Kamailio Web UI</p>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <small class="text-muted">Default: admin / admin</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
