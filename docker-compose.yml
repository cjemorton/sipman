# ============================================================
# SipMan Backend — Docker Compose for Coolify Deployment
# ============================================================
# In Coolify:
#   1. Create a new resource → Docker Compose
#   2. Paste this file (or link the repo)
#   3. Set environment variables in the Coolify UI
#   4. Deploy
#
# For multi-cluster: deploy multiple instances with different
# CLUSTER_ID values and point PEER_NODES at each other.
# ============================================================

services:
  sipman:
    # Prebuilt image from GitHub Actions → GitHub Container Registry.
    # The deployment server (micro-87-224, 764MB RAM) cannot build this
    # image locally (kamailio + mariadb + rtpengine + python3) without
    # running out of memory. GitHub Actions builds and pushes here.
    # For local development, comment out `image:` and uncomment `build:`.
    image: ghcr.io/mrnet-work/sipman:latest
    # build: .
    container_name: sipman-backend
    restart: unless-stopped

    # ---- Network Mode: host ----
    # SIP/RTP servers require host networking for optimal performance:
    #   - Zero docker-proxy overhead (no per-port proxy processes)
    #   - RTPEngine binds directly to host ports (dynamic RTP allocation)
    #   - No NAT/bridge latency for real-time media
    #   - Industry standard for Kamailio/RTPEngine/Asterisk/FreeSWITCH
    # NOTE: port mappings are ignored in host mode — all container ports
    # are directly accessible on the host. Ensure host firewall allows:
    #   5000/tcp (API), 5060/udp+tcp (SIP), 5061/tcp (SIPS), 10000-20000/udp (RTP)
    network_mode: host

    # ---- Environment (override in Coolify UI or .env file) ----
    environment:
      - CLUSTER_ID=${CLUSTER_ID:-primary}
      - CLUSTER_NAME=${CLUSTER_NAME:-Primary SIP Cluster}
      - SIP_DOMAIN=${SIP_DOMAIN:-sip.mrnet.work}
      - SIP_EXTERNAL_IP=${SIP_EXTERNAL_IP:-127.0.0.1}
      - SIP_PORT=${SIP_PORT:-5060}
      - SIPS_PORT=${SIPS_PORT:-5061}
      - MARIADB_DB=${MARIADB_DB:-kamailio}
      - MARIADB_USER=${MARIADB_USER:-kamailio}
      - MARIADB_PASS=${MARIADB_PASS:-kamailio}
      - MARIADB_ROOT_PASS=${MARIADB_ROOT_PASS:-}
      - RTPENGINE_HOST=${RTPENGINE_HOST:-127.0.0.1}
      - RTPENGINE_PORT=${RTPENGINE_PORT:-7722}
      - RTPENGINE_INTERFACE=${RTPENGINE_INTERFACE:-0.0.0.0}
      - SIPMAN_ADMIN_USER=${SIPMAN_ADMIN_USER:-admin}
      - SIPMAN_ADMIN_PASS=${SIPMAN_ADMIN_PASS:-ChangeMeNow!2026#sipman}
      - SIPMAN_JWT_SECRET=${SIPMAN_JWT_SECRET:-}
      - PEER_NODES=${PEER_NODES:-}
      - PEER_SYNC_SECRET=${PEER_SYNC_SECRET:-}
      - PEER_SYNC_ENABLED=${PEER_SYNC_ENABLED:-false}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - CLUSTER_BACKEND_URL=${CLUSTER_BACKEND_URL:-http://localhost:5000}

    # ---- Volumes (persistent data) ----
    # NOTE: With network_mode: host, named volumes still work.
    volumes:
      - sipman-mysql:/var/lib/mysql
      - sipman-data:/data

    # ---- Health check ----
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  sipman-mysql:
  sipman-data:
